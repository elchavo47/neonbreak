name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'NeonBreak/**'
      - 'NeonBreak.xcodeproj/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'NeonBreak/**'
      - 'NeonBreak.xcodeproj/**'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -project NeonBreak.xcodeproj \
            -scheme NeonBreak \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log; status=${PIPESTATUS[0]}
          # Derleme hataları özet olarak görünsün (Actions sayfasında "Annotations").
          grep -E "error:" build.log | sort -u | head -40 | while read -r line; do echo "::error::${line##*/NeonBreak/}"; done
          exit $status

      - name: BoardGenerator self-test (board.php ile aynı mı)
        run: |
          sed -n '1,/^}/p' NeonBreak/Game/GameSession.swift | grep -v '^import Combine' > gen.swift
          echo 'print(BoardGenerator.selfTest() ? "SELFTEST OK" : "SELFTEST FAIL"); if !BoardGenerator.selfTest() { exit(1) }' >> gen.swift
          swiftc gen.swift -o gen && ./gen
