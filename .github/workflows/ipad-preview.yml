name: iPad Preview

# Elle çalıştırılır: uygulamayı simülatörde açıp iPad ve iPhone ekran görüntülerini
# "device-shots" dalına yükler (App Review öncesi iPad görünüm kontrolü).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project NeonBreak.xcodeproj -scheme NeonBreak -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -20

      - name: Take screenshots
        run: |
          set -x
          APP=$(find build/Build/Products -name 'NeonBreak.app' -maxdepth 3 | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          mkdir -p shots
          xcrun simctl list devices available > shots/devices.txt
          pick() { xcrun simctl list devices available -j | python3 -c "
          import sys,json,re
          d=json.load(sys.stdin)['devices']; pat=re.compile(sys.argv[1])
          c=[x for k,v in d.items() if 'iOS' in k for x in v if pat.search(x['name'])]
          print(c[-1]['udid'] if c else '')" "$1"; }
          for spec in "ipad-pro-13|iPad Pro 13" "ipad|^iPad \(|^iPad Air" "ipad-mini|iPad mini" "iphone-se|iPhone SE" "iphone-pro-max|iPhone 1[5-7] Pro Max"; do
            NAME=${spec%%|*}; PAT=${spec#*|}
            UDID=$(pick "$PAT")
            [ -z "$UDID" ] && { echo "no device for $PAT"; continue; }
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            for route in home shop coins profile leaderboard settings game; do
              xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              xcrun simctl launch "$UDID" "$BUNDLE" -NBShot "$route"
              sleep 12
              xcrun simctl io "$UDID" screenshot "shots/${NAME}_${route}.png" || true
            done
            xcrun simctl shutdown "$UDID" || true
          done
          ls -la shots

      - name: Publish screenshots
        run: |
          cd shots
          git init -q
          git config user.name "ipad-preview"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q -b device-shots
          git add -A
          git commit -q -m "Device screenshots ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" device-shots
