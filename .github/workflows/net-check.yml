name: Network Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Reach backend from a datacenter IP
        shell: bash {0}
        run: |
          for v in "" "--http1.1"; do
          for u in https://neonbreak.aydworks.com.tr/sitemap.xml https://neonbreak.aydworks.com.tr/robots.txt; do
            code=$(curl -sS $v -m 20 -o body.txt -w "%{http_code} %{http_version} %{content_type}" -A "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)" "$u" 2>err.txt); rc=$?
            echo "::notice::[$v] $u -> rc=$rc $code :: $(head -c 200 err.txt | tr '\n' ' ') :: $(head -c 700 body.txt 2>/dev/null | tr '\n' ' ')"
          done
          done
